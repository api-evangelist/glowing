aid: glowing
name: Glow
description: >-
  Glow (glowing.com) is a women's health and reproductive-health technology company whose consumer
  mobile apps track periods, ovulation, fertility, pregnancy, and early baby development for a
  community of more than 25 million members. Its app suite spans Glow (ovulation and fertility),
  Eve by Glow (period tracking), Glow Nurture (pregnancy), and Glow Baby (infant development), and
  it layers AI-powered health insights through GlowGPT along with a Glow Premium subscription and a
  companion Glow Shop for hardware such as basal thermometers, test strips, and a smart breast pump.
  Surfaced as a portfolio company of Slow Ventures and added to the API Evangelist network, Glow is a
  consumer app business with no public developer program: no API portal, developer documentation,
  SDKs, or OpenAPI surface could be located during enrichment.
